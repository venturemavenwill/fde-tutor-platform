openapi: 3.1.0
info:
  title: FDE Tutor Phase 1 Platform API
  version: 1.0.0
  description: >
    Phase 1 no-LMS API for Entra-backed identity, tenant-scoped access metadata,
    and the S083 learning loop. Learning commands require a validated Learner
    app role and an Idempotency-Key. S083 is non-assessment-bearing and has no
    mastery effect.
servers:
  - url: http://localhost:5080
    description: Local development
security:
  - entra:
      - access_as_user
paths:
  /api/v1/access:
    get:
      summary: Get the signed-in user's identity and the G-02 authorization matrix
      responses:
        "200":
          description: Durable subject, effective app roles, and six-role matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessConsoleResponse"
        "403":
          description: Missing delegated scope or approved tenant/object claims
  /api/v1/access/users:
    get:
      summary: List tenant-scoped observed user metadata
      description: >
        Requires the Administrator app role. Microsoft Entra remains the
        assignment authority; this endpoint does not enrol users or mutate roles.
      responses:
        "200":
          description: Tenant-scoped durable subjects without email or learner evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObservedUserResponse"
        "403":
          description: Administrator app role required
  /api/v1/s083/content:
    get:
      summary: Get the public, pre-reveal S083 content contract
      responses:
        "200":
          description: Versioned S083 organizer, vocabulary, and prompts
  /api/v1/s083/learning-home:
    get:
      summary: Get the current S083 state and due retrievals
      responses:
        "200":
          description: Learner-owned current state
  /api/v1/s083/sessions:
    post:
      summary: Start an S083 learning session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRequest"
      responses:
        "200":
          description: Session start event and current policy
  /api/v1/s083/sessions/{sessionId}:
    get:
      summary: Get one learner-owned S083 session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Event-backed S083 state
        "404":
          description: No visible session for the authenticated learner
  /api/v1/s083/sessions/{sessionId}/expectation:
    $ref: "#/components/pathItems/TextCommand"
  /api/v1/s083/sessions/{sessionId}/cold-start:
    $ref: "#/components/pathItems/NamedCommand"
  /api/v1/s083/sessions/{sessionId}/priming:
    $ref: "#/components/pathItems/NamedCommand"
  /api/v1/s083/sessions/{sessionId}/unpaid-remedy:
    $ref: "#/components/pathItems/TextCommand"
  /api/v1/s083/sessions/{sessionId}/criterion:
    get:
      summary: Get the criterion only after UnpaidRemedyRecorded
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Four-element durable criterion
        "409":
          description: UNPAID_REMEDY_REQUIRED
  /api/v1/s083/sessions/{sessionId}/source:
    get:
      summary: Get the authored session source after UnpaidRemedyRecorded
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Sanitizable package-owned HTML
        "409":
          description: UNPAID_REMEDY_REQUIRED
  /api/v1/s083/sessions/{sessionId}/source/open:
    post:
      summary: Record opening the authored source and return its content
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRequest"
      responses:
        "200":
          description: SourceViewed event, policy, and package-owned HTML
        "409":
          description: Typed policy denial
  /api/v1/s083/sessions/{sessionId}/criterion/reveal:
    post:
      summary: Record criterion reveal and return the criterion
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRequest"
      responses:
        "200":
          description: Reveal event, policy, and criterion
        "409":
          description: Typed policy denial
  /api/v1/s083/sessions/{sessionId}/comparison:
    $ref: "#/components/pathItems/TextCommand"
  /api/v1/s083/sessions/{sessionId}/revision:
    $ref: "#/components/pathItems/TextCommand"
  /api/v1/s083/sessions/{sessionId}/authentic-transfer:
    $ref: "#/components/pathItems/TextCommand"
  /api/v1/s083/sessions/{sessionId}/retrieval-schedule:
    post:
      summary: Schedule changed-context S083 retrieval
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalScheduleRequest"
      responses:
        "200":
          description: RetrievalScheduled event
  /api/v1/s083/sessions/{sessionId}/retrieval:
    $ref: "#/components/pathItems/TextCommand"
components:
  securitySchemes:
    entra:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
          scopes:
            access_as_user: Use the FDE Tutor Platform as the signed-in learner
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    AccessConsoleResponse:
      type: object
      required:
        - schemaVersion
        - matrixVersion
        - currentUser
        - userManagement
        - roles
        - capabilities
      properties:
        schemaVersion:
          type: string
        matrixVersion:
          type: string
        currentUser:
          $ref: "#/components/schemas/CurrentUserAccessResponse"
        userManagement:
          $ref: "#/components/schemas/UserManagementBoundaryResponse"
        roles:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/AuthorizationRoleResponse"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AuthorizationCapabilityResponse"
    CurrentUserAccessResponse:
      type: object
      required:
        - tenantId
        - objectId
        - externalSubject
        - authenticationMode
        - isSynthetic
        - roles
        - effectiveCapabilities
      properties:
        tenantId:
          type: string
          format: uuid
        objectId:
          type: string
          format: uuid
        externalSubject:
          type: string
        authenticationMode:
          type: string
          enum: [Development, Entra]
        isSynthetic:
          type: boolean
        roles:
          type: array
          items:
            type: string
        effectiveCapabilities:
          type: array
          items:
            type: string
    UserManagementBoundaryResponse:
      type: object
      required:
        - assignmentAuthority
        - roleMutationAvailable
        - enrolmentAvailable
        - directoryMode
      properties:
        assignmentAuthority:
          type: string
        roleMutationAvailable:
          type: boolean
          const: false
        enrolmentAvailable:
          type: boolean
          const: false
        directoryMode:
          type: string
          enum: [InMemory, Postgres]
    AuthorizationRoleResponse:
      type: object
      required: [id, label, description]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
    AuthorizationCapabilityResponse:
      type: object
      required: [id, label, constraint, access]
      properties:
        id:
          type: string
        label:
          type: string
        constraint:
          type: string
        access:
          type: object
          additionalProperties:
            type: string
            enum: [Allow, Deny, Deferred, External]
    ObservedUserResponse:
      type: object
      required:
        - tenantId
        - objectId
        - externalSubject
        - authenticationMode
        - roles
        - firstObservedAt
        - lastObservedAt
      properties:
        tenantId:
          type: string
          format: uuid
        objectId:
          type: string
          format: uuid
        externalSubject:
          type: string
        authenticationMode:
          type: string
        roles:
          type: array
          items:
            type: string
        firstObservedAt:
          type: string
          format: date-time
        lastObservedAt:
          type: string
          format: date-time
    RevisionRequest:
      type: object
      required:
        - contentRevision
      properties:
        contentRevision:
          type: string
          pattern: "^[0-9a-f]{64}$"
    TextSubmissionRequest:
      allOf:
        - $ref: "#/components/schemas/RevisionRequest"
        - type: object
          required:
            - response
          properties:
            response:
              type: string
              minLength: 1
              maxLength: 12000
    NamedResponsesRequest:
      allOf:
        - $ref: "#/components/schemas/RevisionRequest"
        - type: object
          required:
            - responses
          properties:
            responses:
              type: object
              minProperties: 1
              additionalProperties:
                type: string
                minLength: 1
                maxLength: 12000
    RetrievalScheduleRequest:
      allOf:
        - $ref: "#/components/schemas/RevisionRequest"
        - type: object
          required:
            - dueAt
          properties:
            dueAt:
              type: string
              format: date-time
  pathItems:
    TextCommand:
      parameters:
        - $ref: "#/components/parameters/SessionId"
      post:
        summary: Append one text response under deterministic S083 policy
        parameters:
          - $ref: "#/components/parameters/IdempotencyKey"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextSubmissionRequest"
        responses:
          "200":
            description: Accepted event and current policy
          "409":
            description: Typed policy or revision denial
    NamedCommand:
      parameters:
        - $ref: "#/components/parameters/SessionId"
      post:
        summary: Append a named response set under deterministic S083 policy
        parameters:
          - $ref: "#/components/parameters/IdempotencyKey"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamedResponsesRequest"
        responses:
          "200":
            description: Accepted event and current policy
          "409":
            description: Typed policy or revision denial
